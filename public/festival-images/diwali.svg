<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Goddess Lakshmi on lotus with lamps for Diwali puja" data-subject="lakshmi">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="55%" stop-color="#3d2818"/>
      <stop offset="100%" stop-color="#5c3d1e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#FFD978" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#A86A12" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A86A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E85D8A"/>
      <stop offset="100%" stop-color="#9B1B4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#sky)"/>
  <rect width="640" height="240" fill="url(#halo)"/>
  <!-- stars -->
  <g fill="#FAF5EA" opacity="0.55">
    <circle cx="58" cy="34" r="1.2"/><circle cx="112" cy="22" r="1"/><circle cx="178" cy="40" r="1.3"/>
    <circle cx="470" cy="28" r="1.1"/><circle cx="538" cy="18" r="1.4"/><circle cx="592" cy="36" r="1"/>
  </g>
  <!-- lotus seat -->
  <g transform="translate(320,178)" filter="url(#glow)">
    <ellipse cx="0" cy="18" rx="92" ry="14" fill="#2d6b3a" opacity="0.5"/>
    <path d="M-78 18 Q-52 -8 -26 18 Q0 -14 26 18 Q52 -8 78 18 Q52 34 0 34 Q-52 34 -78 18 Z" fill="#e84393" opacity="0.85"/>
    <path d="M-52 18 Q-26 2 0 18 Q26 2 52 18 Q26 28 0 28 Q-26 28 -52 18 Z" fill="#ff6b9d"/>
    <path d="M-26 18 Q0 8 26 18 Q0 24 -26 18 Z" fill="#ffc1d9"/>
  </g>
  <!-- Lakshmi figure -->
  <g transform="translate(320,108)">
    <!-- crown -->
    <path d="M-28 -52 L-18 -72 L-6 -58 L6 -72 L18 -58 L28 -72 L38 -52 Z" fill="url(#gold)" stroke="#8B5A12" stroke-width="1"/>
    <circle cx="0" cy="-66" r="5" fill="#C2451E"/>
    <!-- face -->
    <ellipse cx="0" cy="-38" rx="22" ry="26" fill="#F4C9A0"/>
    <path d="M-8 -42 Q0 -36 8 -42" fill="none" stroke="#8B4518" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="-7" cy="-40" rx="2.2" ry="3" fill="#3B3147"/>
    <ellipse cx="7" cy="-40" rx="2.2" ry="3" fill="#3B3147"/>
  <!-- bindi -->
    <circle cx="0" cy="-48" r="3" fill="#C2451E"/>
    <!-- body / sari -->
    <path d="M-34 -12 C-40 20 -28 58 0 62 C28 58 40 20 34 -12 C20 -4 -20 -4 -34 -12 Z" fill="url(#sari)"/>
    <path d="M-18 8 L0 48 L18 8" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- four arms -->
    <path d="M-34 -8 C-58 -4 -72 18 -64 38" fill="none" stroke="#F4C9A0" stroke-width="10" stroke-linecap="round"/>
    <path d="M34 -8 C58 -4 72 18 64 38" fill="none" stroke="#F4C9A0" stroke-width="10" stroke-linecap="round"/>
    <path d="M-28 0 C-48 24 -44 52 -30 64" fill="none" stroke="#F4C9A0" stroke-width="9" stroke-linecap="round"/>
    <path d="M28 0 C48 24 44 52 30 64" fill="none" stroke="#F4C9A0" stroke-width="9" stroke-linecap="round"/>
    <!-- attributes: lotus, coins, mudras -->
    <circle cx="-68" cy="36" r="11" fill="#ff6b9d" stroke="#fff" stroke-width="1.5"/>
    <circle cx="68" cy="36" r="11" fill="#ff6b9d" stroke="#fff" stroke-width="1.5"/>
    <g fill="url(#gold)" stroke="#8B5A12" stroke-width="0.8">
      <ellipse cx="-34" cy="58" rx="7" ry="4"/><ellipse cx="-22" cy="62" rx="6" ry="3.5"/>
      <ellipse cx="22" cy="62" rx="6" ry="3.5"/><ellipse cx="34" cy="58" rx="7" ry="4"/>
    </g>
  </g>
  <!-- diyas row -->
  <g transform="translate(0,0)" opacity="0.95">
    <g transform="translate(120,196)"><path d="M0 28h36c-3-8-1-18 6-24 5-4 11-5 12-5s7 1 12 5c7 6 9 16 6 24H0z" fill="#6B3410"/><ellipse cx="18" cy="28" rx="18" ry="4" fill="#4a2208"/><path d="M14 6c0-5 3-8 4-10 1 2 4 5 4 10" fill="#FFD86B"/><ellipse cx="18" cy="4" rx="8" ry="11" fill="#FFE9A8" filter="url(#glow)"/></g>
    <g transform="translate(220,192)"><path d="M0 32h42c-4-10-2-22 8-28 6-5 13-6 15-6s9 1 15 6c10 6 12 18 8 28H0z" fill="#6B3410"/><ellipse cx="21" cy="32" rx="21" ry="5" fill="#4a2208"/><path d="M16 8c0-6 4-10 5-12 1 2 5 6 5 12" fill="#FFD86B"/><ellipse cx="21" cy="6" rx="10" ry="13" fill="#FFE9A8" filter="url(#glow)"/></g>
    <g transform="translate(378,192)"><path d="M0 32h42c-4-10-2-22 8-28 6-5 13-6 15-6s9 1 15 6c10 6 12 18 8 28H0z" fill="#6B3410"/><ellipse cx="21" cy="32" rx="21" ry="5" fill="#4a2208"/><path d="M16 8c0-6 4-10 5-12 1 2 5 6 5 12" fill="#FFD86B"/><ellipse cx="21" cy="6" rx="10" ry="13" fill="#FFE9A8" filter="url(#glow)"/></g>
    <g transform="translate(478,196)"><path d="M0 28h36c-3-8-1-18 6-24 5-4 11-5 12-5s7 1 12 5c7 6 9 16 6 24H0z" fill="#6B3410"/><ellipse cx="18" cy="28" rx="18" ry="4" fill="#4a2208"/><path d="M14 6c0-5 3-8 4-10 1 2 4 5 4 10" fill="#FFD86B"/><ellipse cx="18" cy="4" rx="8" ry="11" fill="#FFE9A8" filter="url(#glow)"/></g>
  </g>
  <text x="28" y="36" font-family="Georgia, 'Noto Serif Devanagari', serif" font-size="26" fill="#FAF5EA" font-weight="600">Lakshmi Puja · Diwali</text>
  <text x="28" y="58" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" fill="#E7DDC6" letter-spacing="0.06em">लक्ष्मी पूजा · दीपावली</text>
</svg>
