name: Quality gates (Tier A)

# Tier A of the owner's automated quality plan (2026-07-28): run the deterministic
# validation gate suite + production build on every push to main and on PRs, plus a
# daily safety-net cron. Near-zero cost; catches regressions the moment code changes.
# The deeper adversarial "judgment" pass is Tier B (a scheduled Claude routine).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily safety net
  workflow_dispatch:       # allow manual runs

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: All validation gates
        # Runs the WHOLE validation/ suite (not just the AGENTS.md canonical subset), so
        # every gate — e.g. regional-calendar-modes, doshas, utility-calculators — is a
        # real safety net. Reports each gate then fails if any failed. The two arg-taking
        # gates run explicitly; canonical-deployment is skipped (it checks the live site
        # post-deploy) and the _helpers/hooks are skipped.
        run: |
          fail=0
          echo "== argument gates =="
          node validation/parse-check.js src/kundli-app.tsx || { echo "FAIL parse-check"; fail=1; }
          node validation/prashna-parity.js src/screens/PrashnaScreen.tsx || { echo "FAIL prashna-parity"; fail=1; }
          echo "== self-contained gates =="
          for g in validation/*.cjs validation/prashna-calc.js; do
            b=$(basename "$g")
            case "$b" in _*|canonical-deployment.cjs) echo "skip $b"; continue;; esac
            if node "$g" >/dev/null 2>&1; then echo "ok   $b"; else echo "FAIL $b"; fail=1; fi
          done
          echo "== build =="
          npm run build || { echo "FAIL build"; fail=1; }
          exit $fail

      # Keep the exact bytes the gates just verified, so `deploy` publishes THAT build
      # rather than a second, unverified rebuild of the same commit. Only produced for a
      # real push to main; PR and cron runs have nothing to publish.
      - name: Keep the verified build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- deploy on green only
  #
  # Ganak deployed off the `main` BRANCH rather than off the CHECK RESULT, so a red gate
  # still shipped. `needs: gates` is the fix: this job cannot start unless every gate and
  # the build passed, because the gates step ends in `exit $fail`.
  #
  # ⚠️ THIS JOB IS INERT UNTIL THE OWNER DOES TWO THINGS IN THE DASHBOARDS:
  #
  #   1. Cloudflare Pages -> the Ganak project -> Settings -> Builds & deployments:
  #      DISABLE the automatic Git integration. Until that is off, Cloudflare keeps
  #      building every push to main by itself and this gating achieves nothing —
  #      both paths would deploy, and the unguarded one would usually win the race.
  #
  #   2. GitHub -> Settings -> Secrets and variables -> Actions, add:
  #        CLOUDFLARE_API_TOKEN   (Cloudflare -> My Profile -> API Tokens,
  #                                template "Edit Cloudflare Workers", or a custom
  #                                token with Account | Cloudflare Pages | Edit)
  #        CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard URL, or Workers & Pages -> right rail)
  #      and confirm PAGES_PROJECT below matches the real project name.
  #
  # Until step 2 is done this job FAILS LOUDLY on a missing secret rather than silently
  # skipping — a deploy that quietly does nothing is the same failure mode being fixed here.
  deploy:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PAGES_PROJECT: ganak      # must equal the Cloudflare Pages project name
    steps:
      - uses: actions/checkout@v7

      # Secrets go through env, never interpolated into the shell text: a token containing
      # shell metacharacters would otherwise be executed rather than compared.
      - name: Require deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$CF_TOKEN" ]   || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ $missing -eq 0 ] || { echo "::error::Add the secrets above, then re-run. See the comment block in this workflow."; exit 1; }

      - name: Fetch the verified build
        uses: actions/download-artifact@v4
        with:
          name: verified-dist
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Confirm the live site answers
        run: |
          # Post-deploy smoke test. Pages needs a moment to propagate the new build.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ganak.pages.dev/ || echo 000)
            [ "$code" = "200" ] && { echo "live site returned 200"; exit 0; }
            echo "attempt $i: HTTP $code — retrying"; sleep 10
          done
          echo "::error::ganak.pages.dev did not return 200 after deploy"; exit 1
